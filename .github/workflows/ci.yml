name: CI

on:
    pull_request:
    push:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    pull-requests: read

jobs:
    skip_heavy:
        name: Classify CI scope
        runs-on: ubuntu-latest
        outputs:
            skip_heavy: ${{ steps.classify.outputs.skip_heavy }}
            reason: ${{ steps.classify.outputs.reason }}
        steps:
            - name: Classify changed files
              id: classify
              env:
                  GH_TOKEN: ${{ github.token }}
                  EVENT_NAME: ${{ github.event_name }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  REPOSITORY: ${{ github.repository }}
              run: |
                  set -euo pipefail

                  skip_heavy=false
                  reason="full CI required by default"
                  files=""

                  finish() {
                      {
                          echo "skip_heavy=${skip_heavy}"
                          echo "reason=${reason}"
                      } >> "$GITHUB_OUTPUT"

                      {
                          echo "### CI scope classification"
                          echo
                          echo "${reason}"
                          if [ -n "${files}" ] && [ -s "${files}" ]; then
                              echo
                              echo "Changed files:"
                              sed 's/^/- `/' "${files}" | sed 's/$/`/'
                          fi
                      } >> "$GITHUB_STEP_SUMMARY"
                  }

                  if [ "${EVENT_NAME}" != "pull_request" ]; then
                      reason="full CI required for ${EVENT_NAME} events"
                      finish
                      exit 0
                  fi

                  files="$(mktemp)"
                  if ! gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)' > "${files}"; then
                      reason="full CI required because changed-file detection failed"
                      finish
                      exit 0
                  fi

                  if [ ! -s "${files}" ]; then
                      reason="full CI required because no changed files were detected"
                      finish
                      exit 0
                  fi

                  is_safe_global_ci_skip_file() {
                      case "$1" in
                          *.md) return 0 ;;
                          docs/*) return 0 ;;
                          .github/ISSUE_TEMPLATE/*) return 0 ;;
                          .github/PULL_REQUEST_TEMPLATE/*) return 0 ;;
                          .github/pull_request_template.md) return 0 ;;
                          .github/CODEOWNERS) return 0 ;;
                          CODEOWNERS) return 0 ;;
                          .github/dependabot.yml) return 0 ;;
                          .github/workflows/release.yml) return 0 ;;
                          .github/workflows/release.yaml) return 0 ;;
                          .github/workflows/publish.yml) return 0 ;;
                          .github/workflows/publish.yaml) return 0 ;;
                          .github/workflows/stale.yml) return 0 ;;
                          .github/workflows/stale.yaml) return 0 ;;
                          .github/workflows/lint-pr.yml) return 0 ;;
                          .github/workflows/lint-pr.yaml) return 0 ;;
                          .github/workflows/call-flags-project-board.yml) return 0 ;;
                          .github/workflows/call-flags-project-board.yaml) return 0 ;;
                          .github/workflows/changeset-hygiene.yml) return 0 ;;
                          .github/workflows/changeset-hygiene.yaml) return 0 ;;
                          .github/workflows/dependabot-changeset.yml) return 0 ;;
                          .github/workflows/dependabot-changeset.yaml) return 0 ;;
                          .github/workflows/validate-versioning.yml) return 0 ;;
                          .github/workflows/validate-versioning.yaml) return 0 ;;
                          .github/workflows/new-pr.yml) return 0 ;;
                          .github/workflows/new-pr.yaml) return 0 ;;
                          .github/workflows/generated-files-notice.yml) return 0 ;;
                          .github/workflows/generated-files-notice.yaml) return 0 ;;
                          .github/workflows/posthog-upgrade.yml) return 0 ;;
                          .github/workflows/posthog-upgrade.yaml) return 0 ;;
                          .github/workflows/posthog-watcher-*.yml) return 0 ;;
                          .github/workflows/posthog-watcher-*.yaml) return 0 ;;
                          *) return 1 ;;
                      esac
                  }

                  skip_heavy=true
                  reason="heavy CI skipped because only globally safe docs/metadata files changed"

                  while IFS= read -r file; do
                      if ! is_safe_global_ci_skip_file "${file}"; then
                          skip_heavy=false
                          reason="full CI required because at least one changed file is outside the global docs/metadata safe set"
                          break
                      fi
                  done < "${files}"

                  finish

    typecheck:
        name: Typecheck
        runs-on: ubuntu-latest
        needs: skip_heavy
        steps:
            - name: Skip Typecheck
              if: needs.skip_heavy.outputs.skip_heavy == 'true'
              env:
                  SKIP_REASON: ${{ needs.skip_heavy.outputs.reason }}
              run: echo "$SKIP_REASON"

            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              if: needs.skip_heavy.outputs.skip_heavy != 'true'

            - name: Setup environment
              if: needs.skip_heavy.outputs.skip_heavy != 'true'
              uses: ./.github/actions/setup

            - name: Typecheck
              if: needs.skip_heavy.outputs.skip_heavy != 'true'
              run: pnpm typecheck

    lint:
        name: Lint
        runs-on: ubuntu-latest
        needs: skip_heavy
        steps:
            - name: Skip Lint
              if: needs.skip_heavy.outputs.skip_heavy == 'true'
              env:
                  SKIP_REASON: ${{ needs.skip_heavy.outputs.reason }}
              run: echo "$SKIP_REASON"

            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              if: needs.skip_heavy.outputs.skip_heavy != 'true'

            - name: Setup environment
              if: needs.skip_heavy.outputs.skip_heavy != 'true'
              uses: ./.github/actions/setup

            - name: Lint
              if: needs.skip_heavy.outputs.skip_heavy != 'true'
              run: pnpm lint

    test:
        name: Test
        runs-on: ubuntu-latest
        needs: skip_heavy
        steps:
            - name: Skip Test
              if: needs.skip_heavy.outputs.skip_heavy == 'true'
              env:
                  SKIP_REASON: ${{ needs.skip_heavy.outputs.reason }}
              run: echo "$SKIP_REASON"

            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              if: needs.skip_heavy.outputs.skip_heavy != 'true'

            - name: Setup environment
              if: needs.skip_heavy.outputs.skip_heavy != 'true'
              uses: ./.github/actions/setup

            - name: Test
              if: needs.skip_heavy.outputs.skip_heavy != 'true'
              run: pnpm test

    pack:
        name: Pack dry run
        runs-on: ubuntu-latest
        needs: skip_heavy
        steps:
            - name: Skip Pack dry run
              if: needs.skip_heavy.outputs.skip_heavy == 'true'
              env:
                  SKIP_REASON: ${{ needs.skip_heavy.outputs.reason }}
              run: echo "$SKIP_REASON"

            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              if: needs.skip_heavy.outputs.skip_heavy != 'true'

            - name: Setup environment
              if: needs.skip_heavy.outputs.skip_heavy != 'true'
              uses: ./.github/actions/setup

            - name: Verify package contents
              if: needs.skip_heavy.outputs.skip_heavy != 'true'
              run: npm pack --dry-run
